<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Ledger</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="auth-wrapper">

  <!-- Brand Panel -->
  <div class="auth-brand">
    <div class="brand-logo">
      <div class="brand-icon">💰</div>
      <span class="brand-name">Ledger</span>
    </div>
    <h1 class="brand-tagline">
      Start tracking<br/>
      <span>what matters.</span>
    </h1>
    <p class="brand-desc">
      Create your free account and begin your journey to smarter spending. No credit card needed — just your email.
    </p>
    <div class="brand-stats">
      <div class="stat-item">
        <div class="stat-num">Free</div>
        <div class="stat-label">Forever</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">30s</div>
        <div class="stat-label">Setup</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">🔒</div>
        <div class="stat-label">Encrypted</div>
      </div>
    </div>
  </div>

  <!-- Form Panel -->
  <div class="auth-panel">
    <div class="auth-card">
      <h2>Create account</h2>
      <p class="subtitle">Set up your Ledger account in seconds</p>

      <div class="alert alert-error" id="signupError"></div>
      <div class="alert alert-success" id="signupSuccess"></div>

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <span class="icon">✉</span>
          <input class="has-icon" type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input class="has-icon" type="password" id="signupPassword" placeholder="Minimum 8 characters" autocomplete="new-password" />
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input class="has-icon" type="password" id="signupConfirm" placeholder="Repeat your password" autocomplete="new-password" />
        </div>
      </div>

      <button class="btn btn-primary" id="signupBtn" onclick="handleSignup()">
        Create Account
      </button>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

</div>

<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>
<script>
  if (localStorage.getItem('access_token')) {
    window.location.href = 'dashboard.html';
  }

  async function handleSignup() {
    const email    = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm  = document.getElementById('signupConfirm').value;
    const btn      = document.getElementById('signupBtn');
    const errEl    = document.getElementById('signupError');
    const okEl     = document.getElementById('signupSuccess');

    errEl.className = 'alert';
    okEl.className  = 'alert';

    if (!email || !password || !confirm) {
      showAlert(errEl, 'Please fill in all fields.');
      return;
    }

    if (password.length < 8) {
      showAlert(errEl, 'Password must be at least 8 characters.');
      return;
    }

    if (password !== confirm) {
      showAlert(errEl, 'Passwords do not match.');
      return;
    }

    btn.innerHTML = '<span class="loader"></span> Creating account…';
    btn.disabled = true;

    try {
      const res = await fetch('/users/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        const msg = data.detail || 'Registration failed. Please try again.';
        showAlert(errEl, Array.isArray(msg) ? msg[0]?.msg || 'Validation error.' : msg);
        return;
      }

      showAlert(okEl, '🎉 Account created! Redirecting to sign in…', true);
      setTimeout(() => window.location.href = 'login.html', 1800);

    } catch (err) {
      showAlert(errEl, 'Network error. Please try again.');
    } finally {
      btn.innerHTML = 'Create Account';
      btn.disabled = false;
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSignup();
  });
</script>

</body>
</html>
