services:
  # Web Service
  - type: web
    name: expense-tracker
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    
  # PostgreSQL Database
  - type: pserv
    name: expense-tracker-db
    env: postgres
    plan: free
    ipAllowList: []
    
databases:
  - name: expense-tracker-db
    databaseName: expense_tracker
    user: expense_tracker_user
